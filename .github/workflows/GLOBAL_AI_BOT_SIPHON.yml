name: GLOBAL_AI_BOT_SIPHON

on:
  push:
    paths:
      - 'Protocols/*.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ESEB_AI_SIPHON_RUNNER:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLASSIC_API_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute AI Siphon Protocol
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python Protocols/GlobalAIBotSiphon.eseb

      - name: Execute Serverless Runner
        run: |
          node Protocols/GlobalAIBotSiphon.js

      - name: Commit & Push AI Siphon Artifacts
        env:
          EXEC_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          
          git remote set-url origin "https://x-access-token:${EXEC_TOKEN}@github.com/${{ github.repository }}.git"
          
          git add llms.txt ai.txt Protocols/GlobalAIBotSiphon.ehc Protocols/GlobalAIBotSiphon.js
          if ! git diff-index --quiet HEAD; then
            git commit -m "[V-STAMP-24] Auto-deploy AI Bot Siphon Resources (llms.txt, ai.txt, .ehc, .js)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
