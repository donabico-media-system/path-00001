name: CDNBROADCASTTOKEN

on:
  push:
    paths:
      - 'Protocols/CdnBroadcastToken.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Tự động phát tín hiệu mỗi 4 tiếng
  workflow_dispatch:        # Nút kích hoạt thủ công

jobs:
  broadcast-cdn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Lấy toàn bộ lịch sử commit hỗ trợ rebase mượt mạị

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Master Compiler (.eseb -> .ehc & .js)
        run: |
          python Protocols/CdnBroadcastToken.eseb

      - name: Run Serverless Runner Engine with CLASSIC_API_TOKEN
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          node Protocols/CdnBroadcastToken.js

      - name: Commit & Push Generated Entity Bridges
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add Protocols/CdnBroadcastToken.ehc Protocols/CdnBroadcastToken.js
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Auto-Broadcast CDN Token Engine [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
