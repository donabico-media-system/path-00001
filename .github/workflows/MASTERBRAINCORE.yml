name: MASTERBRAINCORE

on:
  push:
    paths:
      - 'Protocols/MasterBrainCore.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Tự động vận hành 4 tiếng/lần
  workflow_dispatch:        # Kích hoạt thủ công

jobs:
  master-brain-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Lấy toàn bộ lịch sử commit để rebase mượt mà

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Master Compiler (.eseb -> .ehc & .js)
        run: |
          python Protocols/MasterBrainCore.eseb

      - name: Run Master Brain Serverless Engine with Dynamic CLASSIC_API_TOKEN
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          node Protocols/MasterBrainCore.js

      - name: Commit & Push Generated Entity Bridges
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add Protocols/MasterBrainCore.ehc Protocols/MasterBrainCore.js sitemap.xml robots.txt 24242424242424242424242424242424.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Master Brain Core Auto-Update [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
