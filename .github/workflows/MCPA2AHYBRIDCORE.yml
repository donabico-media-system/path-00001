name: MCPA2AHYBRIDCORE

on:
  push:
    paths:
      - 'Protocols/MCPA2aHybridCore.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Tự động vận hành 4 tiếng/lần
  workflow_dispatch:        # Kích hoạt thủ công

jobs:
  mcp-a2a-hybrid-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Hybrid Compiler (.eseb -> .ehc & .js)
        run: |
          python Protocols/MCPA2aHybridCore.eseb

      - name: Run MCP+A2A Serverless Engine & Trigger Real CDN Signal
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          node Protocols/MCPA2aHybridCore.js

      - name: Commit & Push Infrastructure Bridges
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add Protocols/MCPA2aHybridCore.ehc Protocols/MCPA2aHybridCore.js sitemap.xml robots.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Pure MCP+A2A Hybrid Core Auto-Update [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
