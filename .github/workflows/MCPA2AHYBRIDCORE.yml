name: MCPA2AHYBRIDCORE

on:
  push:
    paths:
      - 'Protocols/MCPA2aHybridCore.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Tự động vận hành 4 tiếng/lần
  workflow_dispatch:        # Kích hoạt thủ công

jobs:
  # =========================================================================
  # JOB 1: BIÊN DỊCH PROTOCOL & ĐẨY TỆP HẠ TẦNG LÊN REPO (BRANCH MAIN)
  # =========================================================================
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Hybrid Compiler (.eseb -> .ehc & .js)
        run: |
          python Protocols/MCPA2aHybridCore.eseb

      - name: Commit & Push Infrastructure Files to Main Branch
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add Protocols/MCPA2aHybridCore.ehc Protocols/MCPA2aHybridCore.js sitemap.xml robots.txt 24242424242424242424242424242424.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Infrastructure & Key Files Commit [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      - name: Trigger GitHub Pages CDN Rebuild
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          node Protocols/MCPA2aHybridCore.js

  # =========================================================================
  # JOB 2: PHÁT TÍN HIỆU INDEXNOW (ĐỜI CDN PROPAGATION -> HTTP 200/202 OK)
  # =========================================================================
  indexnow-broadcast:
    needs: build-and-deploy   # Đợi Job 1 thành công mới kích hoạt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for GitHub Pages CDN Propagation
        run: |
          echo "⏳ Waiting 45 seconds for CDN Edge Deployment..."
          sleep 45

      - name: Execute IndexNow Ping (Guaranteed HTTP 200/202 OK)
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");
          
          let domain = "https://path-00001.donabico.com";
          if (fs.existsSync("CNAME")) {
            const cname = fs.readFileSync("CNAME", "utf-8").trim();
            if (cname) domain = cname.startsWith("http") ? cname : "https://" + cname;
          }
          const host = domain.replace("https://", "").replace("http://", "").replace(/\/$/, "");
          const key = "24242424242424242424242424242424";
          
          const postData = JSON.stringify({
            "host": host,
            "key": key,
            "keyLocation": `${domain}/${key}.txt`,
            "urlList": [`${domain}/`]
          });
          
          const options = {
            hostname: "api.indexnow.org",
            port: 443,
            path: "/indexnow",
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              "Content-Length": Buffer.byteLength(postData)
            }
          };
          
          function sendPing(attempt = 1) {
            console.log(`🚀 SENDING INDEXNOW BROADCAST (Attempt ${attempt}) FOR: ${domain}`);
            const req = https.request(options, (res) => {
              console.log(`✅ INDEXNOW SIGNAL RESPONSE: HTTP ${res.statusCode}`);
              if (res.statusCode === 200 || res.statusCode === 202) {
                process.exit(0);
              } else if (attempt < 2) {
                console.log("⚠️ Received non-200 status. Retrying in 20 seconds...");
                setTimeout(() => sendPing(2), 20000);
              } else {
                process.exit(1);
              }
            });
            req.on("error", (e) => {
              console.error(e);
              if (attempt < 2) setTimeout(() => sendPing(2), 20000);
              else process.exit(1);
            });
            req.write(postData);
            req.end();
          }

          sendPing(1);
          '
