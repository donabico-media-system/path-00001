name: SEMANTICREADMECORE

on:
  push:
    paths:
      - 'index.html'
      - 'Protocols/SemanticReadMeCore.eseb'
  schedule:
    - cron: '0 */6 * * *'  # Tự động quét 6 tiếng/lần
  workflow_dispatch:

jobs:
  semantic-readme-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Semantic Academic Compiler with CLASSIC_API_TOKEN
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          python Protocols/SemanticReadMeCore.eseb

      - name: Commit & Push Updated Academic README & Client Bridge
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add README.md Protocols/SemanticReadMeCore.ehc Protocols/.index_hash.lock
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Auto-Compile Academic README.md & .ehc Bridge [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
