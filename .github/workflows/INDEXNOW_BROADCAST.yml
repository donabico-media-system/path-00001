name: INDEXNOW_BROADCAST

on:
  push:
    paths:
      - 'Protocols/*.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Tự động thực thi mỗi 4 tiếng/lần (24/7/365)
  workflow_dispatch:        # Hỗ trợ kích hoạt thủ công từ giao diện GitHub

permissions:
  contents: write

jobs:
  ESEB_BROADCAST_RUNNER:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLASSIC_API_TOKEN }}
          persist-credentials: true
          fetch-depth: 0   # Lấy toàn bộ lịch sử commit để tránh xung đột HEAD

      - name: Setup Python Runtime (Master Engine)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js Runtime (Serverless Runner)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Master Protocol (Generate Dual Entities & Key File)
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python Protocols/IndexNowBroadcast.eseb

      - name: Execute Serverless Runner (Broadcast to Global CDN Gateways)
        run: |
          node Protocols/IndexNowBroadcast.js

      - name: Commit & Push Auto-Generated Artifacts (.ehc, .js & Key txt)
        env:
          EXEC_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          
          # Cấu hình Remote URL xác thực bằng CLASSIC_API_TOKEN
          git remote set-url origin "https://x-access-token:${EXEC_TOKEN}@github.com/${{ github.repository }}.git"
          
          # Đẩy đầy đủ cả bộ đôi thực thi lẫn tệp key xác thực IndexNow
          git add Protocols/*.ehc Protocols/*.js *.txt
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "[V-STAMP-24] Auto-deploy Dual Entities (.ehc, .js) & Key Verification File"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "[V-STAMP-24] No change detected in generated artifacts."
          fi
