name: INDEXNOW_BROADCAST

on:
  push:
    paths:
      - 'Protocols/*.eseb'
  schedule:
    - cron: '0 */4 * * *'  # Chạy tự động 4 tiếng/lần 24/7/365
  workflow_dispatch:        # Kích hoạt thủ công

permissions:
  contents: write

jobs:
  ESEB_BROADCAST_RUNNER:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLASSIC_API_TOKEN }}
          persist-credentials: true
          fetch-depth: 0   # Lấy toàn bộ lịch sử commit để tránh lỗi xung đột ref

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute ESEB Master Protocol
        env:
          GITHUB_CLASSIC_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python Protocols/IndexNowBroadcast.eseb

      - name: Commit & Push Dual Entities (.ehc & .js)
        env:
          EXEC_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          
          # Đặt Remote URL xác thực bằng CLASSIC_API_TOKEN duy nhất
          git remote set-url origin "https://x-access-token:${EXEC_TOKEN}@github.com/${{ github.repository }}.git"
          
          git add Protocols/*.ehc Protocols/*.js
          
          # Kiểm tra thay đổi: Nếu có mới commit, pull rebase và push
          if ! git diff-index --quiet HEAD; then
            git commit -m "[V-STAMP-24] Auto-deploy Dual Entities (.ehc & .js)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "[V-STAMP-24] No changes detected in Dual Entities (.ehc & .js)."
          fi
