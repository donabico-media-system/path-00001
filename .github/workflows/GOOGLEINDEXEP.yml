name: GOOGLEINDEXEP

on:
  push:
    paths:
      - 'Protocols/GoogleIndexEpCore.eseb'
  schedule:
    - cron: '0 */6 * * *'  # Chạy tự động mỗi 6 tiếng
  workflow_dispatch:        # Kích hoạt thủ công

jobs:
  google-indexing-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Google Index Compiler (.eseb -> .ehc & .js)
        run: |
          python Protocols/GoogleIndexEpCore.eseb

      - name: Run Serverless Runner Engine with CLASSIC_API_TOKEN
        env:
          CLASSIC_API_TOKEN: ${{ secrets.CLASSIC_API_TOKEN }}
        run: |
          node Protocols/GoogleIndexEpCore.js

      - name: Commit & Push Generated Entity Bridges & Sitemap (Safe Rebase)
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico-media-system"
          git add Protocols/GoogleIndexEpCore.ehc Protocols/GoogleIndexEpCore.js sitemap.xml robots.txt
          if ! git diff-index --quiet HEAD; then
            git commit -m "[ESEB V3000-Ω] Google Index EP Infrastructure Sync [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
